# Builds the plugin for macOS as a universal (arm64 + x86_64) binary into
# the committed cross-platform .bundle, codesigns + notarizes it, and
# publishes a GitHub Release with the zip and dmg attached.
#
# The plugin is mac-only (AppleScript / ScriptingBridge), so there is no
# Windows build: the prebuilt Contents/Windows64/*.4DX that is committed
# in the bundle is shipped as-is, along with Documentation/ and QuickLook/.
#
# Trigger: manual dispatch with zero inputs. Source metadata at the selected
# immutable github.sha determines the version, not a tag. Publication is
# create-only and follows all native, signing, notarization and stapling gates.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- edit these per-project, everything else is generic ----
  PRODUCT_NAME: Mail (AppleScript)
  XCODE_PROJECT: Mail (AppleScript).xcodeproj
  # keep in sync with MACOSX_DEPLOYMENT_TARGET in the Xcode project
  MACOS_DEPLOYMENT_TARGET: '11.5'
  # --------------------------------------------------------------

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: set
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$SELECTED_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PLUGINS_DIR="${{ env.PRODUCT_NAME }}.4dbase/Plugins"
          BUNDLE_PATH="${PLUGINS_DIR}/${{ env.PRODUCT_NAME }}.bundle"

          # Remove only the stale mac binary (so the verify step can't pass on
          # the committed i386/x86_64 one) and any earlier Default/ output.
          # Do NOT delete the whole bundle: Windows64/, Documentation/ and
          # QuickLook/ are committed and not produced by this build.
          rm -rf "${BUNDLE_PATH}/Contents/MacOS" "${PLUGINS_DIR}/Default"

          # The project-level Default configuration has no
          # CONFIGURATION_BUILD_DIR, so without the override Xcode would write
          # to Plugins/Default/<Product>.bundle instead of the committed bundle.
          # Signing is done in its own step with the Developer ID identity.
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -target "${{ env.PRODUCT_NAME }}" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/${PLUGINS_DIR}" \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BUNDLE_PATH="${{ env.PRODUCT_NAME }}.4dbase/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          BIN="$BUNDLE_PATH/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found at $BIN"
            ls -R "${{ env.PRODUCT_NAME }}.4dbase/Plugins"
            exit 1
          fi
          lipo -info "$BIN"
          # separate lines: under set -e a failure on the left of && is ignored
          lipo -info "$BIN" | grep -q "arm64"
          lipo -info "$BIN" | grep -q "x86_64"
          ls "$BUNDLE_PATH/Contents/Resources/manifest.json" "$BUNDLE_PATH/Contents/Resources/constants.xlf"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          # zip: cross-platform bundle (win + mac binaries together), what most users grab
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: final availability check and create-only publication
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --sha "$SELECTED_SHA" "$ZIP_PATH" "$DMG_PATH"
