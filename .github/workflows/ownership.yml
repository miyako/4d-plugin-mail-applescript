name: Native ownership

on:
  push:
    paths:
      - '4D Plugin API/**'
      - '.github/tests/ownership_host.mm'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'
  pull_request:
    paths:
      - '4D Plugin API/**'
      - '.github/tests/ownership_host.mm'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic native ownership regression (no Mail or automation)
        run: python3 -B -m unittest discover -s .github/tests -p test_ownership.py -v
